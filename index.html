<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torches Up">
<meta name="theme-color" content="#F6F3CF">
<title>Torches Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Warm daylight palette: cream base, sunset-orange torch, sage jungle, sky-blue lagoon */
    --ink:#F6F3CF;
    --panel:#FFFEF6;
    --panel-2:#FBF8DC;
    --panel-3:#FBD2D3;
    --line: rgba(139,22,43,0.12);
    --line-strong: rgba(139,22,43,0.20);
    --sand:#8B162B;
    --sand-dim: rgba(139,22,43,0.86);
    --sand-faint: rgba(139,22,43,0.70);
    --torch:#F37521;
    --torch-light:#F9A15E;
    --torch-text:#B3470B;
    --torch-ink:#4A0A17;
    --teal:#C6B63B;
    --teal-light:#8B162B;
    --rope:#F9B6B8;
    --danger:#8B162B;
    --danger-light:#8B162B;
    --shadow: rgba(139,22,43,0.16);

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    --r-lg:24px; --r-md:16px; --r-sm:12px;
  }
  :root[data-theme="dark"]{ }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1000px 620px at 8% -8%, rgba(243,117,33,0.16), transparent 55%),
      radial-gradient(900px 640px at 100% 0%, rgba(249,182,184,0.40), transparent 55%),
      radial-gradient(800px 700px at 50% 110%, rgba(186,210,232,0.50), transparent 60%),
      var(--ink);
    color:var(--sand);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  h1,h2,h3,.display{ font-family:'Staatliches', 'Work Sans', sans-serif; letter-spacing:0.015em; font-weight:400; }
  ::selection{ background:var(--torch); color:var(--torch-ink); }
  a{ color:var(--torch-text); }
  :focus-visible{ outline:2px solid var(--torch-text); outline-offset:2px; border-radius:6px; }





  select.pill-select{ border-radius:999px; padding:10px 18px; font-weight:600; }

  .eyebrow{ font-size:11.5px; font-weight:800; letter-spacing:0.06em; color:var(--torch-text); text-transform:uppercase; }
  .hero-headline{ font-family:'Staatliches'; font-size:28px; margin:6px 0 2px; line-height:1.05; }
  .hero-sub{ font-size:14px; color:var(--sand-dim); }

  .progress-track{ height:8px; border-radius:999px; background:rgba(139,22,43,0.08); overflow:hidden; margin:14px 0 0; }
  .progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--torch-light), var(--torch)); transition:width .3s ease; }

  .check-chip{ display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--r-md); background:rgba(198,182,59,0.20); border:1px solid rgba(198,182,59,0.60); margin-top:14px; }
  .check-chip .tick{ width:24px; height:24px; border-radius:50%; background:var(--teal); color:#8B162B; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .check-chip .lbl{ font-size:10.5px; font-weight:800; letter-spacing:0.05em; color:var(--sand-faint); text-transform:uppercase; }
  .check-chip .val{ font-size:15.5px; font-weight:700; }




  .list-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 2px; border-bottom:1px solid var(--line); }
  .list-row:last-child{ border-bottom:none; }
  .list-row .t{ font-weight:600; font-size:14.5px; }
  .list-row .sub{ font-size:12px; color:var(--sand-faint); margin-top:2px; }
  .list-row .v{ font-weight:700; font-size:14.5px; white-space:nowrap; }

  .sticker{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-weight:800; font-size:12.5px; transform:rotate(-3deg); box-shadow:2px 3px 0 rgba(74,10,23,0.30); border:1.5px solid rgba(74,10,23,0.35); background:linear-gradient(135deg, var(--torch-light), var(--torch)); color:var(--torch-ink); }


  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--sp-5);
    box-shadow:0 8px 22px var(--shadow);
  }
  .card + .card{ margin-top:var(--sp-4); }
  .grid{ display:grid; gap:var(--sp-3); }
  .row{ display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
  .btw{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{
    padding:10px 16px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:rgba(139,22,43,0.05);
    color:var(--sand); font-size:14px; font-weight:600; transition:background .12s ease, transform .08s ease, border-color .12s ease;
  }
  .btn:hover{ background:rgba(139,22,43,0.09); border-color:var(--line-strong); }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(135deg, var(--torch-light), var(--torch)); border-color:transparent; color:var(--torch-ink); font-weight:800; border-radius:999px; padding:11px 22px; }
  .btn.primary:hover{ background:linear-gradient(135deg, #FBB27A, var(--torch-light)); }
  .btn.ghost{ background:none; border-color:var(--line); }
  .btn.danger{ border-color:rgba(139,22,43,0.45); color:var(--danger-light); }
  .btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .iconbtn{ background:none; border:none; color:var(--sand-faint); font-size:15px; padding:2px 6px; }
  .iconbtn:hover{ color:var(--danger-light); }

  input[type=text], input[type=number], input[type=password], input[type=datetime-local], select, textarea{
    background:rgba(255,254,246,0.85); border:1px solid var(--line-strong); color:var(--sand);
    border-radius:var(--r-sm); padding:9px 11px; font-size:14px; font-family:inherit; width:100%;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--torch); }
  input::placeholder{ color:var(--sand-faint); }
  label.field{ display:block; font-size:12px; color:var(--sand-dim); margin-bottom:5px; }

  .chip{
    display:inline-flex; align-items:center; gap:7px; padding:6px 11px 6px 8px; border-radius:999px;
    background:rgba(139,22,43,0.06); border:1px solid var(--line); font-size:13.5px;
  }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .chip.eliminated{ opacity:0.5; text-decoration:line-through; }

  .empty{ text-align:center; padding:44px 20px; color:var(--sand-dim); }
  .empty .big{ font-size:38px; margin-bottom:10px; opacity:0.9; }

  /* Standings */


  /* Draft */
  .order-track{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:var(--sp-4); }
  .order-chip{ position:relative; padding:8px 14px; border-radius:999px; font-size:13.5px; font-weight:600; border:1px solid var(--line); background:rgba(139,22,43,0.04); display:inline-flex; align-items:center; gap:6px; }
  .order-chip .qn{ font-size:11px; color:var(--sand-faint); }
  .order-chip.active{ background:linear-gradient(135deg, var(--torch-light), var(--torch)); color:var(--torch-ink); border-color:transparent; box-shadow:0 0 0 3px rgba(243,117,33,0.20), 0 0 16px rgba(243,117,33,0.40); animation:pulse 1.8s ease-in-out infinite; }
  .order-chip.active .qn{ color:var(--torch-ink); opacity:0.65; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(243,117,33,0.20), 0 0 12px rgba(243,117,33,0.30); } 50%{ box-shadow:0 0 0 5px rgba(243,117,33,0.10), 0 0 20px rgba(243,117,33,0.50); } }
  .roundline{ font-size:15px; color:var(--sand-dim); margin-bottom:var(--sp-4); }
  .roundline b{ color:var(--sand); }
  .feed{ max-height:290px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; margin-bottom:var(--sp-4); }
  .feed-msg{ display:flex; align-items:flex-start; gap:9px; padding:8px 12px 8px 8px; border-radius:var(--r-md); background:rgba(139,22,43,0.04); font-size:14px; }
  .feed-msg .fav{ width:24px; height:24px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:var(--torch-ink); margin-top:1px; }
  .feed-msg .txt{ flex:1; }
  .feed-msg b{ color:var(--sand); }
  .feed-msg .ts{ float:right; font-size:11px; color:var(--sand-faint); }
  .feed-empty{ color:var(--sand-faint); font-size:13.5px; padding:10px 2px; }
  .survivor-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
  .survivor-btn{ padding:12px 10px; border-radius:var(--r-md); border:1px solid var(--line-strong); background:rgba(139,22,43,0.03); font-size:14px; font-weight:600; color:var(--sand); text-align:center; }
  .survivor-btn:hover:not(:disabled){ border-color:var(--torch); background:rgba(243,117,33,0.10); }
  .survivor-btn:disabled{ opacity:0.32; cursor:not-allowed; }
  .team-card{ border-radius:var(--r-md); padding:12px 14px; border:1px solid var(--line); background:rgba(139,22,43,0.03); border-top:3px solid var(--line-strong); }
  .team-card h4{ margin:0 0 8px; font-size:15px; font-weight:700; font-family:'Work Sans'; display:flex; align-items:center; gap:7px; }
  .team-card ul{ margin:0; padding-left:18px; font-size:13.5px; color:var(--sand-dim); }

  /* Bonus */
  .bonus-card{ border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; background:rgba(139,22,43,0.025); }
  .bonus-card + .bonus-card{ margin-top:var(--sp-3); }
  .bonus-type{ font-size:12px; padding:3px 9px; border-radius:999px; background:rgba(186,210,232,0.75); color:var(--teal-light); }
  .bonus-day{ font-size:12px; color:var(--sand-dim); }
  .bonus-title{ font-size:16px; font-weight:700; margin:6px 0 2px; }
  .bonus-prompt{ font-size:13.5px; color:var(--sand-dim); margin-bottom:10px; }
  .resp-grid{ display:grid; grid-template-columns:1fr auto; gap:8px 10px; align-items:center; font-size:13.5px; }
  .resolve-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .correct-badge{ font-size:12px; padding:3px 9px; border-radius:999px; background:rgba(243,117,33,0.20); color:var(--torch-text); }

  /* Setup */
  .list-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .stepper{ display:flex; align-items:center; gap:var(--sp-3); }
  .stepper .num{ font-family:'Staatliches'; font-size:28px; min-width:38px; text-align:center; }

  .banner{ padding:10px 14px; border-radius:var(--r-sm); background:rgba(243,117,33,0.12); border:1px solid rgba(243,117,33,0.3); font-size:13.5px; color:var(--torch-text); margin-bottom:var(--sp-4); }
  .banner.info{ background:rgba(186,210,232,0.55); border-color:rgba(186,210,232,1); color:var(--teal-light); }

  #toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 12px); background:#8B162B; border:1px solid rgba(246,243,207,0.25); color:#F6F3CF; padding:10px 18px; border-radius:999px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; box-shadow:0 10px 24px rgba(139,22,43,0.35); }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }



  .gate{ max-width:560px; margin:24px auto; }
  .chip-btn{ cursor:pointer; font-family:inherit; color:var(--sand); font-size:14px; padding:9px 14px 9px 10px; }
  .chip-btn:hover{ border-color:var(--torch); background:rgba(243,117,33,0.12); }
  .survivor-btn small{ display:block; font-weight:500; font-size:10.5px; color:var(--sand-dim); margin-top:3px; }
  .surv-row{ cursor:pointer; }
  .surv-row:hover{ background:rgba(139,22,43,0.03); }
  .ev-panel{ background:rgba(139,22,43,0.03); border-radius:var(--r-md); padding:4px 12px; margin:2px 0 8px; }
  .ev-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); }
  .ev-row:last-child{ border-bottom:none; }
  .ev-ctl{ display:flex; align-items:center; gap:10px; }
  .ev-ctl .n, .ev-row > .n{ min-width:20px; text-align:center; font-weight:800; }

  .thumb{ border-radius:50%; object-fit:cover; flex:none; display:inline-block; background:linear-gradient(160deg,var(--rope),var(--torch)); }
  .thumb-txt{ display:inline-flex; align-items:center; justify-content:center; font-family:'Staatliches',sans-serif; color:var(--torch-ink); letter-spacing:0.02em; }
  .survivor-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .survivor-btn b{ font-weight:700; }
  .team-row{ display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13.5px; color:var(--sand-dim); }
  .hist-pick{ border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; margin-top:10px; background:rgba(255,254,246,0.6); }
  .hist-head{ display:flex; align-items:center; gap:10px; }
  .hist-head .t{ font-weight:700; font-size:14.5px; }
  .hist-head .sub{ font-size:12px; color:var(--sand-faint); }
  .hist-head .v{ font-family:'Staatliches',sans-serif; font-size:22px; }
  .hist-ev{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:5px 0 0 52px; color:var(--sand-dim); }
  .hist-ev span:last-child{ font-weight:700; color:var(--sand); }


  .card.wl-bar{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-family:inherit; font-size:14px; color:var(--sand); cursor:pointer; padding:12px 16px; }
  .card.wl-bar:hover{ border-color:var(--torch); }
  .wl-bar-t{ font-weight:800; white-space:nowrap; }
  .wl-bar-s{ flex:1; min-width:0; font-size:13px; color:var(--sand-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl-bar-c{ color:var(--sand-faint); }
  .wl-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); }
  .wl-row:last-of-type{ border-bottom:none; }
  .wl-n{ width:22px; text-align:center; font-family:'Staatliches',sans-serif; font-size:18px; color:var(--sand-dim); flex:none; }
  .wl-t{ flex:1; min-width:0; }
  .wl-t .t{ font-weight:700; font-size:14.5px; }
  .wl-t .sub{ font-size:12px; color:var(--sand-dim); }
  .wl-ctl{ display:flex; gap:2px; flex:none; }
  .wl-ctl .iconbtn{ font-size:14px; padding:6px 8px; }
  .wl-row.gray{ opacity:0.5; }
  .wl-row.gray .thumb{ filter:grayscale(1); }
  .wl-row.gray .t{ text-decoration:line-through; }
  .rubric-row{ display:grid; grid-template-columns:1fr 72px 32px; gap:8px; align-items:center; margin-bottom:8px; }

  /* ================= v2 frame: sidebar (desktop) + tab bar (phone), colour-blocked tiles, podium ================= */
  :root{ --maxw:1040px; --pad:20px; --r-lg:22px; --r-md:14px; --r-sm:10px;
         --crimson:#8B162B; --rose:#F9B6B8; --arctic:#BAD2E8; --pear:#C6B63B; --latte:#F6F3CF; --sienna:#F37521; }
  @media (min-width:720px){ :root{ --pad:36px; } }
  html,body{ height:auto; }
  body{ min-height:100vh; }
  .app{ min-height:100vh; }
  .main{ min-width:0; display:flex; flex-direction:column; min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); }
  .page{ flex:1; width:100%; max-width:var(--maxw); margin:0 auto; padding:0 var(--pad) 24px; }
  .page > .card:first-child, .page > .gate:first-child{ margin-top:22px; }
  .page > .banner:first-child{ margin-top:18px; }
  .side{ display:none; }

  /* brand */
  .s-brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-tile{ width:38px; height:38px; border-radius:12px; background:linear-gradient(145deg,var(--torch-light),var(--torch)); display:flex; align-items:center; justify-content:center; color:var(--crimson); box-shadow:0 6px 14px rgba(243,117,33,0.32); flex:none; }
  .brand-tile .ic{ stroke-width:2; }
  .brand-w{ font-family:'Staatliches','Work Sans',sans-serif; font-size:27px; line-height:1; letter-spacing:0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* phone top bar */
  .mbar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 10px; background:rgba(246,243,207,0.92); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .mbar .brand-w{ font-size:24px; }

  /* identity chip (always visible, in the member's own colour) */
  .id-chip{ display:flex; align-items:center; gap:10px; min-width:0; background:var(--panel); border:2px solid var(--torch); border-radius:999px; padding:3px 14px 3px 3px; }
  .who-av{ width:34px; height:34px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--torch-ink); flex:none; cursor:pointer; font-family:inherit; }
  .who-t{ min-width:0; line-height:1.15; text-align:left; }
  .who-l{ font-size:9px; font-weight:800; letter-spacing:0.14em; color:var(--sand-faint); }
  .who-n{ font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }
  .chip-out{ display:block; background:none; border:none; padding:0; font:inherit; font-size:11px; color:var(--sand-dim); text-decoration:underline; cursor:pointer; }
  .mbar .who-l{ display:none; }

  /* phone tab bar */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:45; display:flex; gap:2px; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); background:rgba(255,254,246,0.96); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
  .tab-i{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; background:none; border:none; font:inherit; font-size:10.5px; font-weight:700; color:var(--sand-faint); cursor:pointer; }
  .tab-pill{ display:flex; align-items:center; justify-content:center; width:50px; height:30px; border-radius:999px; transition:background .15s ease; }
  .tab-i.active{ color:var(--crimson); }
  .tab-i.active .tab-pill{ background:var(--rose); }

  /* compact page title */
  .pagebar{ padding:30px 0 16px; }
  .pg-dash{ display:block; width:34px; height:6px; border-radius:999px; background:var(--torch); margin-bottom:12px; }
  .pg{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:clamp(36px,7vw,48px); line-height:1; margin:0; letter-spacing:0.01em; }
  .pg-s{ margin:10px 0 0; color:var(--sand-dim); font-size:15.5px; line-height:1.5; max-width:560px; }
  .h1{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; }
  .h2, .sec-h{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:28px; line-height:1; margin:0 0 12px; letter-spacing:0.01em; }
  .sec-s{ margin:-4px 0 16px; color:var(--sand-dim); font-size:15px; }
  .section{ margin-top:44px; }
  .hero-headline{ font-size:clamp(32px,7vw,46px); }

  /* bento tiles (palette colour blocks) */
  .bento{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding-top:24px; }
  .tile{ position:relative; overflow:hidden; border-radius:var(--r-lg); padding:22px; min-width:0; }
  .t-hero{ grid-column:1 / -1; background:var(--rose); color:var(--crimson); }
  .t-torch{ grid-column:1 / -1; background:var(--crimson); color:var(--latte); }
  .t-draft{ background:var(--arctic); color:var(--crimson); }
  .t-lead{ background:var(--pear); color:var(--crimson); }
  .t-k{ font-size:11px; font-weight:800; letter-spacing:0.14em; opacity:0.78; }
  .t-h{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:clamp(48px,10vw,72px); line-height:0.95; margin:10px 0 10px; }
  .t-p{ font-size:16.5px; line-height:1.5; margin:0 0 20px; }
  .t-p b{ font-weight:800; }
  .t-cta{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .btn.dark{ background:var(--crimson); color:var(--latte); border:none; border-radius:999px; padding:12px 22px; font-weight:800; }
  .btn.dark:hover{ background:#a31c34; }
  .linkbtn{ background:none; border:none; font:inherit; font-weight:700; font-size:14.5px; color:var(--crimson); cursor:pointer; padding:10px 2px; text-decoration:underline; text-underline-offset:4px; }
  .tc-l{ font-size:11px; font-weight:800; letter-spacing:0.16em; color:rgba(246,243,207,0.75); }
  .tc-n{ font-family:'Staatliches','Work Sans',sans-serif; font-size:58px; line-height:1; color:var(--latte); margin:6px 0 18px; }
  .tc-n small{ font-size:26px; color:rgba(246,243,207,0.6); }
  .torches{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px 4px; justify-items:center; }
  .tch{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:34px; }
  .tch.lit{ color:#FFC27A; }
  .tch.lit svg{ fill:rgba(255,194,122,0.6); filter:drop-shadow(0 0 6px rgba(255,150,60,0.7)); }
  .tch.out{ color:var(--rose); opacity:0.32; }
  .torch-cap{ margin-top:18px; font-size:13.5px; color:rgba(246,243,207,0.82); }
  .tk-ic{ width:38px; height:38px; border-radius:50%; background:rgba(255,254,246,0.62); display:flex; align-items:center; justify-content:center; color:var(--crimson); margin-bottom:14px; }
  .tk-l{ font-size:10.5px; font-weight:800; letter-spacing:0.14em; opacity:0.78; }
  .tk-d{ font-weight:800; font-size:16px; line-height:1.3; margin-top:6px; }
  .tk-c{ display:inline-block; margin-top:14px; padding:5px 12px; border-radius:999px; background:var(--crimson); color:var(--latte); font-size:12px; font-weight:800; }
  .tk-c.live{ background:var(--torch); color:var(--torch-ink); }
  .t-draft.dashed{ background:transparent; border:2px dashed rgba(139,22,43,0.4); text-align:left; font:inherit; color:var(--crimson); cursor:pointer; }
  .ld-row{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .ld-n{ font-family:'Staatliches','Work Sans',sans-serif; font-size:30px; line-height:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ld-s{ margin-top:12px; font-size:14px; }
  .ld-s b{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:36px; vertical-align:-3px; margin-right:2px; }
  @media (min-width:900px){
    .bento{ grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; padding-top:26px; }
    .t-hero{ grid-column:1 / span 7; }
    .t-torch{ grid-column:8 / span 5; grid-row:1 / span 2; }
    .t-draft{ grid-column:1 / span 4; }
    .t-lead{ grid-column:5 / span 3; }
    .t-hero, .t-torch{ padding:28px; }
  }

  /* podium */
  .podium{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px; align-items:end; max-width:520px; margin:6px auto 0; }
  .pod{ text-align:center; min-width:0; position:relative; }
  .pod-fl{ display:block; color:var(--torch); margin-bottom:2px; }
  .pod-fl svg{ fill:rgba(249,161,94,0.55); filter:drop-shadow(0 0 6px rgba(243,117,33,0.5)); }
  .pod-av{ width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:var(--torch-ink); border:3px solid var(--panel); box-shadow:0 6px 14px var(--shadow); }
  .pod-1 .pod-av{ width:68px; height:68px; font-size:21px; }
  .pod-n{ font-weight:800; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px; }
  .pod-p{ font-family:'Staatliches','Work Sans',sans-serif; font-size:26px; line-height:1.1; color:var(--torch-text); }
  .pod-b{ margin-top:10px; border-radius:18px 18px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-family:'Staatliches','Work Sans',sans-serif; font-size:36px; line-height:1; color:var(--crimson); }
  .pod-1 .pod-b{ height:122px; background:linear-gradient(180deg,var(--torch-light),var(--torch)); color:var(--torch-ink); }
  .pod-2 .pod-b{ height:90px; background:var(--rose); }
  .pod-3 .pod-b{ height:68px; background:var(--arctic); }

  /* full standings list */
  .lb{ border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); overflow:hidden; box-shadow:0 8px 22px var(--shadow); }
  .lb-r{ display:grid; grid-template-columns:30px 38px 1fr auto auto 16px; align-items:center; gap:12px; width:100%; padding:15px 18px; border:none; border-top:1px solid var(--line); background:none; text-align:left; font:inherit; color:var(--sand); cursor:pointer; }
  .lb > .lb-r:first-child{ border-top:none; }
  .lb-r:hover{ background:rgba(139,22,43,0.035); }
  .lb-r.first{ background:linear-gradient(90deg, rgba(243,117,33,0.16), rgba(243,117,33,0) 72%); }
  .lb-rk{ font-family:'Staatliches','Work Sans',sans-serif; font-size:24px; color:var(--sand-dim); text-align:center; }
  .lb-r.first .lb-rk{ color:var(--torch-text); }
  .lb-av{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--torch-ink); flex:none; }
  .lb-nm{ font-weight:800; font-size:16px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-nm .you{ color:var(--sand-faint); font-weight:500; font-size:13px; }
  .lb-nm .lb-bar{ display:block; height:5px; border-radius:999px; background:rgba(139,22,43,0.08); margin-top:8px; overflow:hidden; }
  .lb-bar i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--torch-light),var(--torch)); }
  .lb-wk, .lb-pt{ text-align:right; line-height:1; }
  .lb-wk i, .lb-pt i{ display:block; font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:0.12em; color:var(--sand-faint); }
  .lb-wk b{ display:block; font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:24px; margin-top:4px; }
  .lb-pt b{ display:block; font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:34px; color:var(--torch-text); }
  .lb-pt i{ margin-top:2px; }
  .lb-chev{ color:var(--sand-faint); transition:transform .2s ease; font-size:14px; }
  .lb-r.open .lb-chev{ transform:rotate(180deg); }
  .lb-detail{ padding:6px 18px 24px; border-top:1px solid var(--line); background:rgba(139,22,43,0.025); }
  .pd-sum{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; padding:16px 0 4px; }
  .pd-sum b{ display:block; font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:30px; color:var(--torch-text); line-height:1; }
  .pd-sum i{ display:block; font-style:normal; font-size:10px; font-weight:800; letter-spacing:0.1em; line-height:1.35; color:var(--sand-dim); margin-top:6px; }
  .pd-week{ margin-top:22px; }
  .pd-wh{ display:flex; justify-content:space-between; align-items:flex-end; }
  .pd-ws{ font-size:13px; color:var(--sand-dim); margin-top:2px; }
  .pd-wp{ font-family:'Staatliches','Work Sans',sans-serif; font-size:30px; color:var(--torch-text); line-height:1; }

  /* rules */
  .rules{ display:grid; grid-template-columns:1fr; gap:0 40px; }
  .rule{ display:flex; justify-content:space-between; gap:16px; padding:13px 2px; border-bottom:1px solid var(--line); font-size:14.5px; }
  .rule b{ font-weight:800; white-space:nowrap; }
  .rule b.pos{ color:var(--torch-text); }
  .rule b.neg{ color:var(--danger-light); }
  .rulings{ background:var(--panel-3); border-radius:var(--r-md); padding:16px 18px 8px; margin-top:22px; }
  .rulings p{ position:relative; padding-left:18px; margin:0 0 10px; font-size:14px; line-height:1.55; color:var(--sand-dim); }
  .rulings p::before{ content:""; position:absolute; left:2px; top:0.6em; width:7px; height:7px; border-radius:50%; background:var(--torch); }
  @media (min-width:720px){ .rules{ grid-template-columns:1fr 1fr; } }

  /* the tribe (poster grid) */
  .cast-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  @media (min-width:720px){ .cast-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; } }
  @media (min-width:1100px){ .cast-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .cast-it{ display:flex; flex-direction:column; padding:0; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); }
  .cast-ph{ position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; background:linear-gradient(160deg,var(--rope),var(--torch)); display:flex; align-items:center; justify-content:center; font-family:'Staatliches','Work Sans',sans-serif; font-size:50px; color:var(--torch-ink); }
  .cast-ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cast-tx{ display:flex; flex-direction:column; padding:12px 14px 16px; min-width:0; }
  .cast-tx h3{ font-family:'Work Sans',sans-serif; font-size:16.5px; font-weight:700; letter-spacing:0; margin:0; line-height:1.2; }
  .cast-j{ order:1; margin-top:5px; font-size:13.5px; font-weight:800; }
  .cast-m{ order:2; margin-top:3px; font-size:12.5px; color:var(--sand-dim); }
  .cast-q{ order:3; margin-top:8px; font-size:12.5px; font-style:italic; color:var(--sand-dim); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cast-o{ order:4; margin-top:8px; font-size:12px; font-weight:700; color:var(--sand-dim); }
  .cast-it.out .cast-ph{ filter:grayscale(1); opacity:0.62; }
  .cast-it.out .cast-tx{ opacity:0.58; }
  .snuff{ position:absolute; left:10px; top:10px; padding:4px 9px; border-radius:999px; background:rgba(74,10,23,0.82); color:#F6F3CF; font-family:'Work Sans',sans-serif; font-size:10px; font-weight:800; letter-spacing:0.1em; }
  .credit{ font-size:12.5px; color:var(--sand-faint); margin:18px 2px 0; }

  /* draft hero card tinted by state */
  .card.dh{ border:none; box-shadow:none; }
  .dh-idle{ background:var(--arctic); }
  .dh-wait{ background:var(--rose); }
  .dh-your{ background:linear-gradient(135deg,var(--torch-light),var(--torch)); color:var(--torch-ink); }
  .dh-done{ background:var(--pear); }
  .dh .eyebrow, .dh .hero-sub, .dh .hero-headline{ color:inherit; }
  .dh .eyebrow, .dh .hero-sub{ opacity:0.82; }
  .dh .progress-track{ background:rgba(139,22,43,0.16); }
  .dh .progress-fill{ background:var(--crimson); }
  .dh .check-chip{ background:rgba(255,254,246,0.6); border-color:rgba(139,22,43,0.18); }

  /* footer + misc */
  .foot{ margin-top:48px; padding:22px 0 24px; border-top:1px solid var(--line); }
  .foot-in{ max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); font-size:13px; color:var(--sand-dim); }
  .card + .card{ margin-top:18px; }
  .gate{ max-width:520px; margin:36px auto; padding:30px 28px; }
  .gate .hero-headline{ margin:8px 0 0; }
  .gate .hero-sub{ margin:10px 0 22px; line-height:1.5; }
  .gate .list-wrap{ margin:0 0 6px; gap:10px; }
  .gate .eyebrow + .row{ margin-top:12px !important; }
  @media (max-width:719px){
    .gate .row > input{ max-width:none !important; flex:1 1 100%; }
    .gate .row > .btn.primary{ width:100%; }
    .lb-r{ grid-template-columns:26px 34px 1fr auto auto 14px; gap:10px; padding:14px 14px; }
    .lb-av{ width:34px; height:34px; }
    .lb-nm{ font-size:15.5px; }
    .lb-pt b{ font-size:30px; }
    .lb-wk b{ font-size:21px; }
    .lb-detail{ padding:4px 14px 20px; }
    .card{ padding:20px; }
  }

  /* desktop: sidebar frame */
  @media (min-width:900px){
    .app{ display:grid; grid-template-columns:248px minmax(0,1fr); }
    .main{ padding-bottom:0; }
    .mbar, .tabbar{ display:none; }
    .side{ display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; padding:26px 16px 22px; border-right:1px solid var(--line); background:rgba(255,254,246,0.55); }
    .side .s-brand{ padding:0 8px 16px; }
    .s-week{ align-self:flex-start; margin:0 8px 16px; padding:5px 12px; border-radius:999px; background:var(--pear); color:var(--crimson); font-size:11px; font-weight:800; letter-spacing:0.1em; }
    .s-nav{ display:flex; flex-direction:column; gap:4px; }
    .nav-i{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:14px; border:none; background:none; font:inherit; font-size:15px; font-weight:700; color:var(--sand-dim); text-align:left; cursor:pointer; }
    .nav-i .ic{ color:var(--torch-text); flex:none; }
    .nav-i:hover{ background:rgba(139,22,43,0.06); color:var(--sand); }
    .nav-i.active{ background:var(--crimson); color:var(--latte); }
    .nav-i.active .ic{ color:var(--torch-light); }
    .s-user{ margin-top:auto; }
    .s-user .id-chip{ border-radius:20px; padding:10px 14px 10px 10px; width:100%; }
    .s-user .who-av{ width:40px; height:40px; }
    .s-user .who-n{ max-width:120px; }
    .foot{ margin-top:56px; }
  }

  /* torch tile fills its (taller) desktop cell */
  .t-torch{ display:flex; flex-direction:column; }
  .t-torch .torch-cap{ margin-top:auto; padding-top:18px; }
  @media (min-width:900px){
    .t-torch .torches{ flex:1; align-content:space-evenly; gap:10px 4px; }
    .t-torch .tch{ width:34px; height:40px; }
    .t-torch .tch svg{ width:30px; height:30px; }
  }

  /* ================= castaway pop-up + tappable names ================= */
  body.modal-open{ overflow:hidden; }
  .sheet-bg{ position:fixed; inset:0; z-index:90; background:rgba(74,10,23,0.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; animation:sbg .18s ease; }
  .sheet{ position:relative; width:100%; max-width:460px; max-height:90vh; overflow:auto; background:var(--panel); border-radius:28px 28px 0 0; box-shadow:0 -12px 40px rgba(74,10,23,0.3); padding-bottom:env(safe-area-inset-bottom,0px); animation:sup .22s ease; overscroll-behavior:contain; }
  @keyframes sbg{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes sup{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
  @media (min-width:720px){ .sheet-bg{ align-items:center; padding:24px; } .sheet{ border-radius:28px; max-height:86vh; } }
  .sheet-x{ position:absolute; top:12px; right:12px; z-index:2; width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,254,246,0.92); color:var(--crimson); font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(74,10,23,0.25); }
  .sheet-ph{ position:relative; aspect-ratio:4/3.4; background:linear-gradient(160deg,var(--rope),var(--torch)); display:flex; align-items:center; justify-content:center; font-family:'Staatliches','Work Sans',sans-serif; font-size:84px; color:var(--torch-ink); overflow:hidden; border-radius:28px 28px 0 0; }
  .sheet-ph img{ width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
  .sheet-ph.out{ filter:grayscale(1); }
  .sheet-b{ padding:18px 22px 24px; }
  .sheet-n{ font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:36px; line-height:1; margin:0; }
  .sheet-j{ font-weight:800; font-size:16px; margin-top:8px; }
  .sheet-m{ color:var(--sand-dim); font-size:14px; margin-top:4px; }
  .sheet-q{ font-style:italic; color:var(--sand-dim); font-size:14.5px; margin-top:10px; }
  .sheet-stats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .sheet-stats b{ display:block; font-family:'Staatliches','Work Sans',sans-serif; font-weight:400; font-size:28px; line-height:1; color:var(--torch-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-stats i{ display:block; font-style:normal; font-size:10px; font-weight:800; letter-spacing:0.1em; color:var(--sand-dim); margin-top:6px; }
  .sheet-credit{ margin-top:14px; font-size:12px; color:var(--sand-faint); }
  .sheet-edit{ margin-top:14px; }

  .nm{ cursor:pointer; text-decoration:underline; text-decoration-color:rgba(139,22,43,0.3); text-underline-offset:3px; }
  .team-row[data-act], .wl-t[data-act], .wl-info, .surv-ph, .hist-head > div[data-act]{ cursor:pointer; }
  .surv-ph, .wl-info{ display:inline-flex; flex:none; }
  .sv-wrap{ position:relative; }
  .sv-wrap .survivor-btn{ width:100%; height:100%; }
  .sv-i{ position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; border:1px solid var(--line-strong); background:var(--panel); font:inherit; font-size:12px; font-weight:800; font-style:italic; font-family:Georgia,serif; color:var(--sand-dim); cursor:pointer; padding:0; line-height:1; }
  .sv-i:hover{ background:var(--panel-3); color:var(--crimson); }
  button.tch{ border:none; background:none; padding:0; cursor:pointer; font:inherit; transition:transform .15s ease; }
  button.tch:hover{ transform:scale(1.18); }
  .torch-hint{ font-size:12px; color:rgba(246,243,207,0.6); margin-top:4px; }

  /* ================= season picks / keep / trades ================= */
  .team-label{ margin:12px 0 4px; font-size:10px; font-weight:800; letter-spacing:0.14em; color:var(--sand-faint); }
  .team-label:first-of-type{ margin-top:6px; }
  .team-row .tag{ margin-left:auto; font-style:normal; font-size:10px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:var(--panel-3); color:var(--torch-text); }
  .keep-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .keep-row:last-of-type{ border-bottom:none; }
  .keep-row.kept{ background:linear-gradient(90deg, rgba(198,182,59,0.18), rgba(198,182,59,0) 70%); border-radius:12px; padding-left:10px; }
  .keep-row.gray{ opacity:0.5; }
  .keep-row .wl-t{ flex:1; min-width:0; }
  .trade-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; margin-top:8px; background:var(--panel-3); border-radius:14px; flex-wrap:wrap; }
  .tr-t{ flex:1 1 220px; font-size:14px; line-height:1.45; }
  .tr-b{ display:flex; gap:8px; }
  .trade-form{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) auto; gap:8px; align-items:center; margin-top:8px; }
  .trade-form select{ width:100%; min-width:0; padding:11px 12px; border-radius:12px; border:1px solid var(--line-strong); background:var(--panel); font:inherit; font-size:14px; color:var(--sand); }
  .trade-done{ font-size:13px; color:var(--sand-dim); padding:5px 2px; }
  .trade-done b{ text-transform:capitalize; color:var(--sand); }
  .nav-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--torch); color:var(--torch-ink); font-size:11px; font-weight:800; line-height:1; }
  .nav-i .nav-badge{ margin-left:auto; }
  .tab-pill{ position:relative; }
  .tab-pill .nav-badge{ position:absolute; top:-4px; right:-2px; min-width:18px; height:18px; font-size:10px; border:2px solid var(--panel); box-sizing:content-box; }
  .pd-grp{ margin:14px 0 2px; font-size:10px; font-weight:800; letter-spacing:0.14em; color:var(--sand-faint); }
  .fmt{ background:var(--panel-3); border-radius:var(--r-md); padding:14px 18px 6px; margin-bottom:6px; }
  .fmt p{ margin:0 0 10px; font-size:14px; line-height:1.5; color:var(--sand-dim); }
  .fmt b{ color:var(--sand); }
  @media (max-width:719px){
    .trade-form{ grid-template-columns:1fr; }
    .trade-form .btn{ width:100%; }
  }

  /* how it works (signed-out visitors) */
  .hiw-bar{ margin-top:16px; }
  .hiw-wrap{ margin-top:22px; }
  .hiw-wrap + .bento{ padding-top:16px; }

function matchFileToSurvivor(fileName) {

  // Each word in the file name is compared with each castaway's first name, last name and nickname.

  const lead = standings[0] && standings[0].total > 0 ? standings[0] : null;
  const topPts = standings[0] ? Math.max(0, standings[0].total) : 0;
  const n = memberList().length, shownWk = latestScoredWeek() || c.currentWeek;
  let out = (m ? "" : '<div class="hiw-wrap">' + howItWorks() + "</div>") + '<section class="bento"><div class="tile t-hero"><div class="t-k">WEEK ' + c.currentWeek + " · " + n + " PLAYER" + (n === 1 ? "" : "S") + '</div><h1 class="t-h">' + (m ? "Hey, " + esc(m.name.split(" ")[0]) : "Welcome, castaway") + '</h1><p class="t-p">' + standingLine(standings) + '</p>' + actionBox() + '<div class="t-cta">' + (function () { const a = nextAction(); if (!m) return '<button class="btn dark" data-act="set-tab" data-tab="draft">Go to the draft</button>'; return a && a.btn ? '<button class="btn dark" data-act="see-action">' + esc(a.btn) + "</button>" : ""; })() + '<button class="linkbtn" data-act="rules-go">How points work →</button></div></div>' +
    torchTile() + draftTile() + leadTile(lead) + "</section>";
  const pod = podium(standings);
  if (pod) out += '<section class="section"><h2 class="sec-h">The podium</h2>' + pod + "</section>";
  if (!n) out += '<section class="section"><div class="card"><div class="empty"><div class="big">🏝️</div>No one has joined yet — once people pick their names, the standings start here.</div></div></section>';
  else out += '<section class="section"><h2 class="sec-h">Full standings</h2><p class="sec-s">Tap a player for the full receipts.</p><div class="lb">' + standings.map((row, i) => {
    const mm = row.member, open = ui.openPlayer === mm.id, first = i === 0 && row.total > 0;
    return '<button class="lb-r' + (first ? " first" : "") + (open ? " open" : "") + '" data-act="open-player" data-id="' + mm.id + '"><span class="lb-rk">' + (i + 1) + '</span><span class="lb-av" style="background:' + mm.color + '">' + esc(initials(mm.name)) + '</span><span class="lb-nm">' + esc(mm.name) + (mm.id === myId ? ' <span class="you">(you)</span>' : "") + '<span class="lb-bar"><i style="width:' + (topPts ? Math.round(Math.max(0, row.total) / topPts * 100) : 0) + '%"></i></span></span><span class="lb-wk"><i>WK ' + shownWk + "</i><b>" + (row.weekly[shownWk] || 0) + '</b></span><span class="lb-pt"><b>' + row.total + "</b><i>PTS</i></span>" + '<span class="lb-chev">▾</span></button>' + (open ? playerDetail(mm.id) : "");
  }).join("") + "</div></section>";
  return out + '<section class="section">' + rulesPanel() + "</section>";
}

function renderWishlist(ctx) {
  const m = me(), d = ctx.draft;
  if (!m) return "";
  const wl = wishlistOf(myId).filter((sid) => survivors[sid]), taken = takenInfo(ctx);
  const firstAvail = wl.find((sid) => !survivors[sid].eliminated && !taken[sid]) || null;
  if (!ui.wlOpen) {
    const summary = wl.length ? wl.length + " player" + (wl.length === 1 ? "" : "s") + (firstAvail ? " · next up: " + esc(survivors[firstAvail].name) : d.status === "complete" ? "" : " · all taken") : "tap to build your list";
    return '<button class="card wl-bar" data-act="wl-toggle"><span class="wl-bar-t">⭐ My wishlist</span><span class="wl-bar-s">' + summary + "</span>" + (m.autopick ? '<span class="correct-badge">⚡ auto-pick on</span>' : "") + '<span class="wl-bar-c">▾</span></button>';
  }
  let out = '<div class="card"><div class="btw" style="margin-bottom:6px;"><div><div class="eyebrow">⭐ MY WISHLIST</div><div class="hero-sub">Rank who you want. They go gray as soon as someone has them.</div></div><div class="row" style="gap:6px;"><button class="btn sm ' + (ui.wlAdd ? "primary" : "ghost") + '" data-act="wl-toggle-add">' + (ui.wlAdd ? "Done" : "+ Add castaways") + '</button><button class="btn sm ghost" data-act="wl-toggle">Hide ▴</button></div></div>';
  out += '<label class="row" style="margin:8px 0 10px;font-size:13.5px;cursor:pointer;"><input type="checkbox" data-act="wl-autopick" ' + (m.autopick ? "checked" : "") + ' style="width:auto;"> <span><b>⚡ Auto-pick for me</b> — drafts my top available player when it\'s my turn</span></label>';
  if (!wl.length) out += '<div class="feed-empty">Nothing here yet — tap "+ Add castaways" and add your favorites in order of preference.</div>';
  wl.forEach((sid, i) => {
    const s = survivors[sid], by = taken[sid], gray = !!by || s.eliminated;
    const who = by && members[by.mid] ? members[by.mid].name : "someone";
    const sub = by ? (by.kind === "season" ? "Season pick of " : by.kind === "kept" ? "Kept by " : "Drafted by ") + who : s.eliminated ? "Eliminated" : "";
    out += '<div class="wl-row' + (gray ? " gray" : "") + '"><span class="wl-n">' + (i + 1) + "</span>" + '<span class="wl-info" data-act="info" data-id="' + sid + '">' + thumb(s, 38) + '</span><div class="wl-t" data-act="info" data-id="' + sid + '"><div class="t">' + esc(s.name) + (firstAvail === sid ? ' <span class="correct-badge">next up</span>' : "") + '</div>' + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + '</div><div class="wl-ctl"><button class="iconbtn" title="Move up" data-act="wl-up" data-id="' + sid + '">▲</button><button class="iconbtn" title="Move down" data-act="wl-down" data-id="' + sid + '">▼</button><button class="iconbtn" title="Remove" data-act="wl-remove" data-id="' + sid + '">✕</button></div></div>';
  });
  if (wl.length && firstAvail === null && d.status !== "complete") out += '<div class="banner" style="margin-top:10px;">Everyone on your wishlist is taken or out — add a few more so auto-pick has someone to grab.</div>';
  if (ui.wlAdd) {
    const inList = new Set(wl), pool = orderedCast().filter((x) => !x.eliminated && !inList.has(x.id));
    out += '<div style="margin-top:12px;"><div class="field">Tap to add to the bottom of your list:</div>' + (pool.length ? '<div class="survivor-grid">' + pool.map((x) => '<div class="sv-wrap"><button class="survivor-btn" data-act="wl-add" data-id="' + x.id + '">' + thumb(x, 40) + "<b>" + esc(x.name) + "</b>" + (taken[x.id] ? "<small>taken</small>" : "") + '</button><button class="sv-i" data-act="info" data-id="' + x.id + '" aria-label="About ' + esc(x.name) + '">i</button></div>').join("") + "</div>" : '<div class="feed-empty">Everyone is already on your list.</div>') + "</div>";
  }
  return out + "</div>";
}

function squadCards(ctx) {
  const sO = seasonOwners(), wO = ctx.kind === "week" ? weeklyOwners(ctx.wk) : {};
  if (!Object.keys(sO).length && !Object.keys(wO).length) return "";
  const sR = rosterOf(sO), wR = rosterOf(wO), kept = ctx.kind === "week" ? keptOf(ctx.wk) : {};
  const line = (sid, tag) => (survivors[sid] ? '<div class="team-row" data-act="info" data-id="' + sid + '">' + thumb(survivors[sid], 28) + "<span>" + esc(survivors[sid].name) + (survivors[sid].eliminated ? " 🕯️" : "") + "</span>" + (tag ? '<em class="tag">' + tag + "</em>" : "") + "</div>" : "");
  const none = '<div style="color:var(--sand-faint);font-size:13px;">Nobody yet</div>';
  return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-top:18px;">' + memberList().map((mm) => {
    const sl = (sR[mm.id] || []).map((sid) => line(sid)).join(""), wl = (wR[mm.id] || []).map((sid) => line(sid, (kept[mm.id] || []).includes(sid) ? "kept" : "")).join("");
    return '<div class="team-card" style="border-top-color:' + mm.color + '"><h4><span class="dot" style="background:' + mm.color + '"></span>' + esc(mm.name) + "</h4>" +
      '<div class="team-label">SEASON</div>' + (sl || none) + (ctx.kind === "week" ? '<div class="team-label">THIS WEEK</div>' + (wl || none) : "") + "</div>";
  }).join("") + "</div>";
}

function renderKeep(ctx) {
  if (!me() || ctx.kind !== "week" || ctx.draft.status !== "not_started") return "";
  const pw = prevWeekWithRoster(ctx.wk);
  const mine = pw ? (rosterOf(weeklyOwners(pw))[myId] || []).filter((sid) => survivors[sid]) : [];
  const kept = new Set(keptOf(ctx.wk)[myId] || []), all = keptOf(ctx.wk);
  const others = memberList().filter((x) => x.id !== myId && (all[x.id] || []).length).map((x) => esc(x.name) + " (" + all[x.id].length + ")");
  const keepCount = mine.filter((sid) => kept.has(sid) && !survivors[sid].eliminated).length;
  let out = '<div class="card"><div class="eyebrow">KEEP OR RELEASE</div><div class="hero-sub" style="margin:4px 0 12px;">' + (mine.length ? "Tap <b>Keep</b> on anyone from last week's weekly squad you want again. Kept players skip the draft; released ones go back in the pool." : "No weekly squad from last week to keep — this is the first weekly draft.") + "</div>";
  mine.forEach((sid) => {
    const sv = survivors[sid], k = kept.has(sid), gone = sv.eliminated;
    out += '<div class="keep-row' + (k && !gone ? " kept" : "") + (gone ? " gray" : "") + '"><span class="wl-info" data-act="info" data-id="' + sid + '">' + thumb(sv, 40) + '</span><div class="wl-t" data-act="info" data-id="' + sid + '"><div class="t">' + esc(sv.name) + '</div><div class="sub">' + (gone ? "Eliminated — can't be kept" : "") + "</div></div>" + (gone ? "" : '<button class="btn sm ' + (k ? "primary" : "ghost") + '" data-act="keep-toggle" data-id="' + sid + '">' + (k ? "✓ Keeping" : "Keep") + "</button>") + "</div>";
  });
  const plan = weeklyPlan(ctx.wk), need = plan.needs[myId] != null ? plan.needs[myId] : WEEKLY_SLOTS - keepCount;
  out += '<div class="hero-sub" style="margin-top:12px;">You\'ll draft ' + "<b>" + need + "</b> new player" + (need === 1 ? "" : "s") + " this week." + (others.length ? " Others keeping: " + others.join(", ") + "." : "") + "</div>" + (plan.limited ? '<div class="hero-sub" style="margin-top:6px;">' + esc(plan.note) + "</div>" : "");
  return out + "</div>";
}

function renderTrades(ctx) {
  if (ctx.kind !== "week" || ctx.draft.status !== "complete") return "";
  const wk = ctx.wk, m = me(), owners = weeklyOwners(wk), roster = rosterOf(owners), scored = weekScored(wk);
  const trades = tradesOf(wk), valid = (t) => owners[t.give] === t.from && owners[t.get] === t.to;
  const pend = trades.filter((t) => t.status === "pending" && valid(t));
  const inc = m ? pend.filter((t) => t.to === myId) : [], outg = m ? pend.filter((t) => t.from === myId) : [];
  const done = trades.filter((t) => t.status === "accepted" || t.status === "declined").slice(-4).reverse();
  const nm = (sid) => (survivors[sid] ? '<b class="nm" role="button" tabindex="0" data-act="info" data-id="' + sid + '">' + esc(survivors[sid].name) + "</b>" : "<b>?</b>");
  const pn = (mid) => (members[mid] ? esc(members[mid].name) : "someone");
  const row = (txt, btns) => '<div class="trade-row"><div class="tr-t">' + txt + '</div><div class="tr-b">' + btns + "</div></div>";
  let out = '<div class="card"><div class="eyebrow">TRADE DESK</div><div class="hero-sub" style="margin:4px 0 12px;">Offer to swap one of your weekly players for someone else\'s — they have to say yes. Season picks can\'t be traded.</div>';
  if (scored) out += '<div class="banner">This week is already scored, so trades are closed.</div>';
  if (inc.length) out += '<div class="team-label">OFFERS TO YOU</div>' + inc.map((t) => row("<b>" + pn(t.from) + "</b> offers " + nm(t.give) + " for your " + nm(t.get), scored ? "" : '<button class="btn primary sm" data-act="trade-accept" data-id="' + t.id + '">Accept</button><button class="btn ghost sm" data-act="trade-decline" data-id="' + t.id + '">Decline</button>')).join("");
  if (outg.length) out += '<div class="team-label">YOUR OFFERS</div>' + outg.map((t) => row("You offered " + nm(t.give) + " to <b>" + pn(t.to) + "</b> for " + nm(t.get) + " — waiting", '<button class="btn ghost sm" data-act="trade-cancel" data-id="' + t.id + '">Cancel</button>')).join("");
  if (m && !scored) {
    const live = (mid) => (roster[mid] || []).filter((sid) => survivors[sid] && !survivors[sid].eliminated), t = ui.trade || {};
    const mine = live(myId), others = memberList().filter((x) => x.id !== myId && live(x.id).length), theirs = t.to ? live(t.to) : [];
    const opt = (v, label, sel) => '<option value="' + v + '"' + (sel ? " selected" : "") + ">" + esc(label) + "</option>";
    if (mine.length && others.length) out += '<div class="team-label">PROPOSE A TRADE</div><div class="trade-form"><select data-act="trade-give"><option value="">I give…</option>' + mine.map((sid) => opt(sid, survivors[sid].name, t.give === sid)).join("") + '</select><select data-act="trade-to"><option value="">…to</option>' + others.map((x) => opt(x.id, x.name, t.to === x.id)).join("") + '</select><select data-act="trade-get"><option value="">…for</option>' + theirs.map((sid) => opt(sid, survivors[sid].name, t.get === sid)).join("") + '</select><button class="btn primary sm" data-act="trade-send">Send offer</button></div>';
    else if (!mine.length) out += '<div class="feed-empty">You have no tradable weekly players.</div>';
  }
  if (done.length) out += '<div class="team-label">RECENT</div>' + done.map((t) => '<div class="trade-done">' + pn(t.from) + " ⇄ " + pn(t.to) + ": " + (survivors[t.give] ? esc(survivors[t.give].name) : "?") + " for " + (survivors[t.get] ? esc(survivors[t.get].name) : "?") + " — <b>" + t.status + "</b></div>").join("");
  return out + "</div>";
}

function renderDraft() {
  const ctx = draftCtx(), d = ctx.draft, wk = ctx.wk, A = isAdmin(), isSeason = ctx.kind === "season";
  let out = "";
  if (wk < 3) out += '<div class="banner info">Weeks 1–2 are for scouting the tribe — the draft opens at week 3. The commissioner can bump the week forward in Setup.</div>';
  if (!memberList().length || !survivorList().length) return out + '<div class="card"><div class="empty"><div class="big">🌴</div>Need at least one player and one castaway before drafting.</div></div>';
  const seq = seqOf(d), picker = d.status === "in_progress" ? currentPickerId(d) : null, done = d.feed.length, total = seq.length, rounds = roundsOf(d) || ctx.per;
  const pct = d.status === "complete" ? 100 : total ? Math.min(100, Math.round((done / total) * 100)) : 0;
  const pickerName = picker && members[picker] ? members[picker].name : "—", round = d.status === "in_progress" ? roundOfPick(d, done) : rounds;
  let headline, sub;
  if (d.status === "not_started") {
    headline = isSeason ? "Pick your season three" : "Ready to draft?";
    sub = isSeason ? "Everyone drafts 3 castaways to keep all season. " + (A ? "Start the order once everyone's here." : "Waiting for the commissioner to start.") : (A ? "Members choose who to keep first, then start the weekly draft." : "Keep or release last week's players below — the commissioner starts the draft.") + (weeklyPlan(wk).limited ? " " + weeklyPlan(wk).note : "");
  } else if (d.status === "complete") { headline = isSeason ? "Season squads set! 🔥" : "Draft complete! 🏁"; sub = isSeason ? "Everyone has 3 castaways for the whole season." : "Every squad is set for week " + wk + "."; }
  else if (picker === myId) { headline = "It's your pick!"; sub = "Round " + round + " of " + rounds + (isSeason ? " · season pick" : ""); }
  else { headline = "Round " + round + " of " + rounds; sub = "Waiting on " + esc(pickerName) + (isSeason ? " · season pick" : ""); }
  out += '<div class="card dh ' + (d.status === "complete" ? "dh-done" : d.status === "in_progress" ? (picker === myId ? "dh-your" : "dh-wait") : "dh-idle") + '"><div class="eyebrow">' + (isSeason ? "SEASON DRAFT · 3 EACH, ALL SEASON" : "WEEK " + wk + " · WEEKLY DRAFT") + ' <span style="display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:' + (d.status === "in_progress" ? "#C6B63B" : d.status === "complete" ? "#8B162B" : "#BAD2E8") + ";color:" + (d.status === "complete" ? "#F6F3CF" : "#3a1018") + ';">' + (d.status === "in_progress" ? "🟢 OPEN · LIVE" : d.status === "complete" ? "🔒 CLOSED" : "⏳ NOT STARTED") + '</span></div><div class="hero-headline">' + esc(headline) + '</div><div class="hero-sub">' + sub + "</div>";
  if (d.status !== "not_started") out += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  const myLast = me() ? d.feed.filter((f) => f.memberId === myId).slice(-1)[0] : null;
  if (myLast && survivors[myLast.survivorId]) out += '<div class="check-chip"><span class="tick">✓</span><div><div class="lbl">Your last pick</div><div class="val">' + esc(survivors[myLast.survivorId].name) + "</div></div></div>";
  if (A && d.status === "in_progress" && picker && picker !== myId && members[picker]) {
    const ph = phones()[picker];
    out += '<div class="check-chip" style="background:rgba(186,210,232,0.5);border-color:#BAD2E8;"><div style="flex:1;"><div class="lbl">Next up</div><div class="val">' + esc(pickerName) + "</div></div>" +
      (ph ? '<a class="btn primary sm" href="' + esc(smsLink(picker, "🔥 " + pickerName + ", you're on the clock in " + cfg().leagueName + "! Round " + round + " — make your pick: " + location.origin + location.pathname)) + '">📱 Text ' + esc(pickerName.split(" ")[0]) + "</a>" : '<button class="btn sm" data-act="set-phone" data-id="' + picker + '">Add their number to text them</button>') + "</div>";
  }
  if (d.status !== "not_started") {
    const late = memberList().filter((x) => !(d.order || []).includes(x.id));
    if (late.length) {
      const names = late.map((x) => esc(x.name)).join(", ");
      out += '<div class="banner" style="margin-top:10px;">' + (late.some((x) => x.id === myId) ? "<b>You joined after this draft started, so you're not in the pick order.</b> " : "<b>" + names + " joined after this draft started and isn't in the pick order.</b> ") + (A ? 'Restart the draft to include everyone.' : "Ask the commissioner to restart the draft so you're included.") + "</div>";
    }
    if (A) out += '<div style="margin-top:10px;"><button class="btn sm ghost" data-act="reset-draft">⟲ Restart this draft' + (d.feed.length ? " (clears " + d.feed.length + " pick" + (d.feed.length === 1 ? "" : "s") + ")" : "") + "</button></div>";
  }
  out += "</div>" + renderKeep(ctx) + renderWishlist(ctx) + '<div class="card">';
  const taken = takenInfo(ctx);
  if (d.status === "not_started") {
    const canUndoSeason = !isSeason && A && seasonDraft().feed.length && !Object.keys(weeks).some((k) => (weeks[k].draft && weeks[k].draft.feed && weeks[k].draft.feed.length) || weekScored(k));
    if (A) out += '<div class="btw"><label class="row" style="font-size:13px;color:var(--sand-dim);"><input type="checkbox" ' + (ui.shuffleOnStart ? "checked" : "") + ' style="width:auto;margin-right:6px;" data-act="toggle-shuffle"> 🎲 Randomize pick order</label><div class="row">' + (canUndoSeason ? '<button class="btn sm ghost" data-act="undo-season">↺ Undo last season pick</button>' : "") + '<button class="btn primary" data-act="start-draft">' + (isSeason ? "Start the season draft" : "Start the weekly draft") + "</button></div></div>";
    else out += '<div class="feed-empty">The commissioner starts the draft from this screen, and the pick order is randomized each time. (Only the commissioner sees the start and randomize options.)</div>';
  } else {
    out += '<div class="order-track">' + d.order.filter((mid) => seq.includes(mid)).map((mid) => { const mm = members[mid]; if (!mm) return ""; return '<span class="order-chip ' + (mid === picker ? "active" : "") + '" style="' + (mid === picker ? "" : "border-color:" + mm.color + "55;") + '">' + esc(mm.name) + (mid === myId ? " (you)" : "") + "</span>"; }).join("") + "</div>";
    out += '<div class="feed">' + (d.feed.length ? "" : '<div class="feed-empty">No picks yet — the first name is up.</div>') + d.feed.map((f, fi) => {
      const mm = members[f.memberId], sv = survivors[f.survivorId];
      return '<div class="feed-msg"><span class="fav" style="background:' + (mm ? mm.color : "#C6B63B") + '">' + esc(mm ? initials(mm.name) : "?") + '</span><span class="txt"><span class="ts">' + new Date(f.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "</span><b>" + esc(mm ? mm.name : "?") + "</b> drafted " + (sv ? '<b class="nm" role="button" tabindex="0" data-act="info" data-id="' + sv.id + '">' + esc(sv.name) + "</b>" : "<b>?</b>") + "</span>" + (A ? '<button class="iconbtn" data-act="remove-pick" data-i="' + fi + '" title="Remove this pick" aria-label="Remove this pick" style="flex:none;">✕</button>' : "") + "</div>";
    }).join("") + "</div>";
    if (d.status === "in_progress") {
      if (picker === myId || A) {
        const avail = survivorList().filter((x) => !x.eliminated && !taken[x.id]);
        out += '<div class="btw" style="margin-bottom:8px;"><div style="font-size:13px;color:var(--sand-dim);">' + (picker === myId ? "Tap your pick:" : "Picking for " + esc(pickerName) + ":") + "</div>" + (A && d.feed.length ? '<button class="btn sm ghost" data-act="undo-pick">↺ Undo last pick</button>' : "") + "</div>";
        { const qp = topAvailable(picker, ctx);
          if (picker === myId && qp) out += '<div style="margin-bottom:12px;"><button class="btn primary" data-act="wl-pick">⚡ Draft my top wishlist pick: ' + esc(survivors[qp].name) + "</button></div>";
          else if (A && picker !== myId && qp) out += '<div style="margin-bottom:12px;"><button class="btn primary sm" data-act="wl-pick-for" data-id="' + picker + '">⚡ Pick from ' + esc(pickerName.split(" ")[0]) + "'s wishlist</button></div>"; }
        out += avail.length ? '<div class="survivor-grid">' + avail.map((x) => '<div class="sv-wrap"><button class="survivor-btn" data-act="draft-pick" data-survivor="' + x.id + '">' + thumb(x, 54) + "<b>" + esc(x.name) + '</b></button><button class="sv-i" data-act="info" data-id="' + x.id + '" aria-label="About ' + esc(x.name) + '">i</button></div>').join("") + "</div>" : '<div class="feed-empty">No eligible survivors left.</div>';
      } else out += '<div class="feed-empty">Sit tight — you\'ll get a turn.</div>';
    } else if (A) {
      out += '<div class="row"><button class="btn sm ghost" data-act="undo-pick">↺ Undo last pick</button>' + (isSeason ? "" : '<button class="btn primary" data-act="advance-week">Advance to week ' + (wk + 1) + " →</button>") + "</div>";
    }
  }
  out += squadCards(ctx);
  return out + "</div>" + renderTrades(ctx);
}

function renderBonus() {
  if (!ui.bonusWeek) ui.bonusWeek = cfg().currentWeek;
  const wkKey = ui.bonusWeek, joined = !!me();

    out += '<div class="row" style="margin-top:14px;"><input type="text" id="new-surv-name" placeholder="Name" style="max-width:170px;"><input type="number" id="new-surv-age" placeholder="Age" style="max-width:80px;"><input type="text" id="new-surv-job" placeholder="Job" style="max-width:170px;"><button class="btn" data-act="add-survivor">Add</button><button class="btn ghost sm" data-act="toggle-bulk">' + (ui.showBulk ? "Cancel" : "📋 Paste a list") + "</button></div>";

  } else out += '<div class="list-wrap">' + orderedCast().map((s) => '<span class="chip ' + (s.eliminated ? "eliminated" : "") + '">' + esc(s.name) + "</span>").join("") + "</div>";
  return out + "</div>";
}

/* ---------------- events ---------------- */
const val = (id) => { const el = $(id); return el ? el.value : ""; };
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  switch (act) {
    case "info": ui.sheet = id; renderModal(); { const x = document.querySelector(".sheet-x"); if (x) x.focus(); } return;
    case "sheet-close": if (el.classList.contains("sheet-bg") && e.target !== el) return; ui.sheet = null; return renderModal();
    case "sheet-edit": if (!needAdmin()) return; ui.sheet = null; ui.tab = "setup"; ui.editSurv = id; renderModal(); render(); window.scrollTo(0, 0); return;
    case "how-toggle": ui.howOpen = !ui.howOpen; return render();
    case "apply-cast": { if (!needAdmin()) return; if (!confirm("Replace age, job, hometown, where they live and the three-word description for the castaways with CBS's list? Photos and eliminations stay as they are.")) return; const n = await applyCastDetails(false); toast(n ? "Updated " + n + " castaways ✓" : "No matching castaways found."); return; }
    case "set-tab": ui.tab = el.getAttribute("data-tab"); render(); window.scrollTo(0, 0); return;
    case "see-action": { const a = nextAction(); if (!a) return; if (a.week) ui.scoringWeek = a.week; ui.tab = a.tab; render(); window.scrollTo(0, 0); return; }
    case "go-setup": ui.tab = "setup"; return render();
    case "pick-me": ui.pinFor = id; return render();
    case "pin-back": ui.pinFor = null; return render();
    case "signin": return signIn(id, val("pin-input"));
    case "join": return joinAs(val("join-name"), val("join-pin"));
    case "watch": ui.watching = true; return render();
    case "signout": return signOut();
    case "set-my-pin": { const p = val("my-pin").trim(); if (!/^\d{4}$/.test(p)) return toast("Use exactly 4 digits."); if (!me()) return; await guard(async () => updateDoc(doc(db, "members", myId), { pinHash: await pinHash(myId, p) })); toast("PIN saved."); return render(); }
    case "edit-profile": ui.editingProfile = true; ui.pickColor = null; return render();
    case "cancel-profile": ui.editingProfile = false; return render();
    case "pick-my-color": ui.pickColor = el.getAttribute("data-color"); return render();
    case "save-profile": { const n = val("my-name").trim() || me().name; ui.editingProfile = false; await guard(() => updateDoc(doc(db, "members", myId), { name: n, color: ui.pickColor || me().color })); return render(); }
    case "leave": if (!myId || !confirm("Leave the league? This removes you from the roster and the standings.")) return; { const old = myId; signOut(); await guard(() => deleteDoc(doc(db, "members", old))); } return;
    case "set-pass": { const p = val("admin-new").trim(); if (p.length < 4) return toast("Use at least 4 characters."); if (config && config.adminHash && !isAdmin()) return toast("Unlock first."); const h = await sha(p); await setConfig({ adminHash: h }); try { localStorage.setItem("tt_admin", h); } catch (x) {} toast("Passcode saved — you're the commissioner."); return render(); }
    case "unlock": { const h = await sha(val("admin-try")); if (config && h === config.adminHash) { try { localStorage.setItem("tt_admin", h); } catch (x) {} toast("Unlocked 👑"); } else toast("That passcode didn't match."); return render(); }
    case "lock": try { localStorage.removeItem("tt_admin"); } catch (x) {} return render();
    case "save-name": if (!needAdmin()) return; return setConfig({ leagueName: val("league-name").trim() || DEFAULT_NAME });
    case "week-dec": return stepWeek(-1);
    case "week-inc": return stepWeek(1);
    case "advance-week": await stepWeek(1); ui.tab = "draft"; return render();
    case "rubric-del": { if (!needAdmin()) return; return saveRubric(cfg().rubric.filter((r) => r.id !== id)); }
    case "rubric-add": { if (!needAdmin()) return; const l = val("rub-new-label").trim(); if (!l) return toast("Name the scoring possibility."); return saveRubric(cfg().rubric.concat([{ id: "r" + Date.now().toString(36), label: l, points: Number(val("rub-new-pts")) || 0 }])); }
    case "set-phone": if (!needAdmin()) return; return setPhone(id);
    case "reset-pin": if (!needAdmin()) return; if (!confirm("Reset " + (members[id] ? members[id].name : "this person") + "'s PIN? They'll choose a new one next time they sign in.")) return; return guard(() => updateDoc(doc(db, "members", id), { pinHash: "" }));
    case "remove-member": if (!needAdmin()) return; if (!confirm("Remove " + (members[id] ? members[id].name : "this person") + " from the league?")) return; return guard(() => deleteDoc(doc(db, "members", id)));
    case "remove-survivor": if (!needAdmin()) return; if (!confirm("Remove " + (survivors[id] ? survivors[id].name : "this castaway") + " from the cast?")) return; return guard(async () => { await deleteDoc(doc(db, "survivors", id)); await deleteDoc(doc(db, "config", "photo-" + id)); });
    case "backup": return downloadBackup();
    case "open-player": ui.openPlayer = ui.openPlayer === id ? null : id; return render();
    case "rules-toggle": ui.rulesOpen = !ui.rulesOpen; return render();
    case "rules-go": { ui.rulesOpen = true; render(); const r = $("rules"); if (r && r.scrollIntoView) r.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    case "edit-surv": ui.editSurv = ui.editSurv === id ? null : id; return render();
    case "save-surv": { if (!needAdmin()) return; const a = Number(val("es-age")); await guard(() => updateDoc(doc(db, "survivors", id), { age: a || null, hometown: val("es-home").trim(), residence: val("es-res").trim(), job: val("es-job").trim(), tagline: val("es-tag").trim() })); ui.editSurv = null; toast("Saved ✓"); return render(); }
    case "clear-draft-at": if (!needAdmin()) return; return setConfig({ draftAt: "" });
    case "save-extras": { if (!needAdmin()) return; const v = val("draft-at"); let draftAt = ""; if (v) { const d = new Date(v); if (!isNaN(d)) draftAt = d.toISOString(); } await setConfig({ draftAt, houseRules: val("house-rules"), photoCredit: val("photo-credit").trim() }); toast("Saved ✓"); return render(); }
    case "wl-toggle": ui.wlOpen = !ui.wlOpen; if (!ui.wlOpen) ui.wlAdd = false; return render();
    case "wl-toggle-add": ui.wlAdd = !ui.wlAdd; return render();
    case "wl-add": { if (!me()) return toast("Sign in first."); const wl = wishlistOf(myId); if (wl.includes(id)) return; return saveWishlist(wl.concat([id])); }
    case "wl-remove": return saveWishlist(wishlistOf(myId).filter((x) => x !== id));
    case "wl-up": case "wl-down": { const wl = wishlistOf(myId).slice(), i = wl.indexOf(id), j = act === "wl-up" ? i - 1 : i + 1; if (i < 0 || j < 0 || j >= wl.length) return; [wl[i], wl[j]] = [wl[j], wl[i]]; return saveWishlist(wl); }
    case "wl-autopick": if (!needMe()) return; return guard(() => updateDoc(doc(db, "members", myId), { autopick: !me().autopick }));
    case "wl-pick": if (!needMe()) return; return pickFromWishlist(myId, false);
    case "wl-pick-for": if (!needAdmin()) return; return pickFromWishlist(id, false);
    case "photo-pick": { if (!needAdmin()) return; ui.photoFor = id; const f = $("photo-file"); f.value = ""; return f.click(); }
    case "photo-remove": if (!needAdmin()) return; return guard(async () => { await updateDoc(doc(db, "survivors", id), { photo: "", hd: null }); await deleteDoc(doc(db, "config", "photo-" + id)); delete bigPhotos[id]; });
    case "photo-bulk": { if (!needAdmin()) return; const f = $("photo-bulk"); f.value = ""; return f.click(); }
    case "add-survivor": { const n = val("new-surv-name").trim(); if (!n) return; return addSurvivors([n + "|" + val("new-surv-age") + "|" + val("new-surv-job")]); }
    case "toggle-bulk": ui.showBulk = !ui.showBulk; return render();
    case "add-bulk": { const lines = val("bulk-input").split("\n").map((x) => x.trim()).filter(Boolean); if (!lines.length) return; addSurvivors(lines); ui.showBulk = false; return render(); }
    case "tribe-toggle": ui.tribeOpen = !ui.tribeOpen; return render();
    case "toggle-eliminated": { if (!needAdmin()) return; const s = survivors[id]; return guard(() => updateDoc(doc(db, "survivors", id), { eliminated: !s.eliminated })); }
    case "open-surv": ui.openSurv = ui.openSurv === id ? null : id; return render();
    case "ev": return adjustEvent(el.getAttribute("data-sid"), el.getAttribute("data-rid"), Number(el.getAttribute("data-delta")));
    case "toggle-shuffle": ui.shuffleOnStart = !ui.shuffleOnStart; return;
    case "start-draft": return startDraft();
    case "draft-pick": return makePick(el.getAttribute("data-survivor"));
    case "undo-pick": return undoPick();
    case "remove-pick": return removePick(Number(el.getAttribute("data-i")));
    case "undo-season": return undoPick(true);
    case "reset-draft": return resetDraft();
    case "keep-toggle": return toggleKeep(id);
    case "trade-send": return sendTrade();
    case "trade-accept": return respondTrade(id, "accept");
    case "trade-decline": return respondTrade(id, "decline");
    case "trade-cancel": return respondTrade(id, "cancel");
    case "toggle-bonus-form": ui.showBonusForm = !ui.showBonusForm; return render();
    case "save-bonus": {
      if (!needMe()) return;
      const admin = isAdmin(), wk = Number(ui.bonusWeek || cfg().currentWeek);
      const title = val("bf-title").trim(); if (!title) return toast("Give the challenge a title.");
      const options = val("bf-options").split(",").map((o) => o.trim()).filter(Boolean);
      const ans = val("bf-answer").trim(); let correct = null;
      if (ans) { correct = options.find((o) => o.toLowerCase() === ans.toLowerCase()); if (!correct) return toast("The correct answer has to match one of the options."); }
      const pts = Number(val("bf-points")) || 0;
      if (!admin) {
        if (bonusList(wk).some((b) => b.createdBy === myId)) return toast("You've already added your challenge for week " + wk + ".");
        if (pts < 0 || pts > MAX_MEMBER_BONUS_POINTS) return toast("Challenges you add can be worth up to " + MAX_MEMBER_BONUS_POINTS + " points.");
      }
      const payload = { week: wk, day: val("bf-day"), type: val("bf-type") || "trivia", title, prompt: val("bf-prompt"), options, points: pts, correctOption: correct, resolved: false, responses: {}, submissions: {}, createdBy: myId, createdAt: Date.now() };
      ui.showBonusForm = false;
      if (admin) await guard(() => addDoc(collection(db, "bonus"), payload));
      else await guard(() => runTransaction(db, async (tx) => {
        const ref = doc(db, "bonus", "w" + wk + "-" + myId);   // one fixed slot per person per week, so it can't be double-submitted
        const snap = await tx.get(ref);
        if (snap.exists()) throw new Error("You've already added your challenge for week " + wk + ".");
        tx.set(ref, payload);
      }));
      return render();
    }
    case "answer-bonus": if (!needMe()) return; return guard(() => updateDoc(doc(db, "bonus", el.getAttribute("data-bonus")), { ["responses." + myId]: el.getAttribute("data-option") }));
    case "resolve-bonus": if (!needMe()) return; return guard(() => updateDoc(doc(db, "bonus", el.getAttribute("data-bonus")), { resolved: true, correctOption: el.getAttribute("data-option") }));
    case "reopen-bonus": if (!needMe()) return; return guard(() => updateDoc(doc(db, "bonus", el.getAttribute("data-bonus")), { resolved: false }));
    case "delete-bonus": if (!needAdmin()) return; if (!confirm("Delete this challenge?")) return; return guard(() => deleteDoc(doc(db, "bonus", el.getAttribute("data-bonus"))));
    case "post-video": {
      if (!needMe()) return;
      const bid = el.getAttribute("data-bonus"), url = val("vid-url-" + bid).trim();
      if (!url) return toast("Paste a video link first.");
      return guard(() => updateDoc(doc(db, "bonus", bid), { ["submissions." + myId]: { videoUrl: url, caption: val("vid-cap-" + bid).trim(), ts: Date.now() } }));
    }
  }
});
document.addEventListener("change", async (e) => {
  const el = e.target, act = el.getAttribute("data-act"), field = el.getAttribute("data-field");
  if (el.id === "pz" || el.id === "pf") {
    if (!needAdmin()) return render();
    return setConfig({ photoZoom: Number($("pz").value), photoFocus: Number($("pf").value) });
  }
  if (el.id === "photo-bulk") { if (!needAdmin()) return; return bulkUploadPhotos(el.files); }
  if (el.id === "photo-file") {
    const f = el.files && el.files[0];
    if (!f || !ui.photoFor || !needAdmin()) return;
    const sid = ui.photoFor;
    return guard(async () => { await savePhotoPair(sid, f); toast("Photo saved ✓"); }, "Couldn't save that photo.");
  }
  if (act === "trade-give") { ui.trade = Object.assign({}, ui.trade, { give: el.value }); return render(); }
  if (act === "trade-to") { ui.trade = Object.assign({}, ui.trade, { to: el.value, get: "" }); return render(); }
  if (act === "trade-get") { ui.trade = Object.assign({}, ui.trade, { get: el.value }); return render(); }
  if (act === "pick-bonus-week") { ui.bonusWeek = Number(el.value); return render(); }
  if (act === "pick-scoring-week") { ui.scoringWeek = Number(el.value); return render(); }
  if (act === "pick-hist-member") { ui.histMember = el.value; return render(); }
  if (field === "rubric-label" || field === "rubric-pts") {
    if (!needAdmin()) return render();
    const id = el.getAttribute("data-id");
    saveRubric(cfg().rubric.map((r) => r.id !== id ? r : field === "rubric-label" ? Object.assign({}, r, { label: el.value.trim() || r.label }) : Object.assign({}, r, { points: Number(el.value) || 0 })));
  }
});
const prefetchBig = (e) => { const el = e.target && e.target.closest ? e.target.closest('[data-act="info"]') : null; if (el) ensureBig(el.getAttribute("data-id")); };
document.addEventListener("pointerdown", prefetchBig, { passive: true });
document.addEventListener("mouseover", prefetchBig, { passive: true });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t || (t.id !== "pz" && t.id !== "pf")) return;
  const z = Number($("pz").value), f = Number($("pf").value);
  applyPhotoVars(z, f);
  const zv = $("pz-v"), fv = $("pf-v");
  if (zv) zv.textContent = String(Math.round(z * 100) / 100) + "×";
  if (fv) fv.textContent = String(f);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; renderModal(); return; }
  const tg = e.target;
  if ((e.key === "Enter" || e.key === " ") && tg && tg.getAttribute && tg.getAttribute("role") === "button" && tg.hasAttribute("data-act")) { e.preventDefault(); tg.click(); return; }
  if (e.key !== "Enter") return;
  const map = { "join-name": "join", "join-pin": "join", "pin-input": "signin", "new-surv-name": "add-survivor", "admin-try": "unlock", "admin-new": "set-pass", "my-pin": "set-my-pin" };
  const act = map[e.target && e.target.id];
  if (act) { e.preventDefault(); const b = document.querySelector('[data-act="' + act + '"]'); if (b) b.click(); }
});
render();

</script>
